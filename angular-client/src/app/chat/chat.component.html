<div class="container">
  <div class="header">
    <button class="btn-back" (click)="goBack()">← Documents</button>
    <h2>Chat with Your Documents</h2>
  </div>

  <div class="history" #historyEl>
    <p *ngIf="messages.length === 0 && !loading" class="empty">
      Ask a question about your uploaded documents.
    </p>

    <div *ngFor="let msg of messages" class="message" [ngClass]="msg.role">
      <span class="role-label">{{ msg.role === 'user' ? 'You' : 'Assistant' }}</span>
      <p class="text">{{ msg.text }}</p>
    </div>

    <div *ngIf="loading" class="message assistant thinking">
      <span class="role-label">Assistant</span>
      <p class="text">Thinking…</p>
    </div>
  </div>

  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="input-row">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Ask a question…"
      (keydown.enter)="submit()"
      [disabled]="loading"
    />
    <button class="btn-primary" (click)="submit()" [disabled]="loading || !query.trim()">
      Send
    </button>
  </div>
</div>
